name: Build minimal FFmpeg 8 SPK

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - recipes/**
      - scripts/**
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: spksrc=supported recipe; latest=experimental upstream
        required: true
        default: spksrc
        type: choice
        options:
          - spksrc
          - latest
      spksrc_ref:
        description: SynoCommunity spksrc branch, tag, or commit
        required: true
        default: master
      arch:
        description: Synology architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - aarch64
          - armv7
          - evansport
          - comcerto2k
          - qoriq
      tcversion:
        description: DSM toolchain version
        required: true
        default: "7.2"
        type: choice
        options:
          - "7.3"
          - "7.2"
          - "7.1"
          - "7.0"
          - "6.2.4"
      spk_rev:
        description: SPK revision number
        required: true
        default: "103"
        type: string
      publish_release:
        description: Create a GitHub Release and attach the generated SPK
        required: true
        default: true
        type: boolean
      release_tag:
        description: Release tag, or auto for a generated tag
        required: true
        default: auto
        type: string
      release_draft:
        description: Create the release as a draft
        required: true
        default: false
        type: boolean
      release_prerelease:
        description: Mark the release as a pre-release
        required: true
        default: false
        type: boolean
      generate_release_notes:
        description: Generate release notes from GitHub
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: >-
      ${{ inputs.arch || vars.SYNOLOGY_ARCH || 'x64' }} /
      DSM ${{ inputs.tcversion || vars.SYNOLOGY_TCVERSION || '7.2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ARCH: ${{ inputs.arch || vars.SYNOLOGY_ARCH || 'x64' }}
      TCVERSION: ${{ inputs.tcversion || vars.SYNOLOGY_TCVERSION || '7.2' }}
      SPKSRC_REF: ${{ inputs.spksrc_ref || vars.SPKSRC_REF || 'master' }}
      SPK_REV: ${{ inputs.spk_rev || vars.SPK_REV || '103' }}
    steps:
      - name: Checkout build overlay
        uses: actions/checkout@v5

      - name: Prepare SynoCommunity spksrc
        shell: bash
        run: bash scripts/prepare-spksrc.sh

      - name: Resolve FFmpeg version
        id: resolve-version
        shell: bash
        env:
          REQUESTED_FFMPEG_VERSION: >-
            ${{ inputs.ffmpeg_version || vars.FFMPEG_VERSION || 'spksrc' }}
        run: |
          version="$REQUESTED_FFMPEG_VERSION"
          if [ "$version" = "spksrc" ]; then
            version="$(
              sed -n 's/^spksrc_ffmpeg_version=//p' \
                spksrc/build-manifest.txt
            )"
          elif [ "$version" = "latest" ]; then
            version="$(
              curl --fail --silent --show-error \
                https://ffmpeg.org/releases/ |
              sed -nE 's/.*ffmpeg-(8\.[0-9]+(\.[0-9]+)?)\.tar\.bz2.*/\1/p' |
              sort -V |
              tail -n 1
            )"
          fi
          if [[ ! "$version" =~ ^8\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported FFmpeg 8 version: $version" >&2
            exit 1
          fi
          echo "Building FFmpeg $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build SPK with SynoCommunity toolchain
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        with:
          entrypoint: /bin/bash
          args: /github/workspace/scripts/build-in-container.sh
        env:
          FFMPEG_VERSION: ${{ steps.resolve-version.outputs.version }}

      - name: Upload SPK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg8-${{ steps.resolve-version.outputs.version }}-${{ env.ARCH }}-${{ env.TCVERSION }}
          path: |
            spksrc/packages/*.spk
            spksrc/build-manifest.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || 'auto' }}
          RELEASE_DRAFT: ${{ inputs.release_draft || false }}
          RELEASE_PRERELEASE: ${{ inputs.release_prerelease || false }}
          GENERATE_RELEASE_NOTES: ${{ inputs.generate_release_notes }}
        run: |
          set -euo pipefail

          version="${{ steps.resolve-version.outputs.version }}"
          release_tag="$RELEASE_TAG_INPUT"
          if [ "$release_tag" = "auto" ]; then
            release_tag="v${version}-r${SPK_REV}-${ARCH}-dsm${TCVERSION}"
          fi

          if ! git check-ref-format "refs/tags/$release_tag"; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          mapfile -t spk_files < <(
            find spksrc/packages -maxdepth 1 -type f -name '*.spk' -print |
              sort
          )
          if [ "${#spk_files[@]}" -eq 0 ]; then
            echo "No SPK package was found for release upload" >&2
            exit 1
          fi

          release_title="FFmpeg ${version} Audio SPK - ${ARCH} / DSM ${TCVERSION}"
          release_args=(
            "$release_tag"
            "${spk_files[@]}"
            spksrc/build-manifest.txt
            --target "$GITHUB_SHA"
            --title "$release_title"
          )

          if [ "$RELEASE_DRAFT" = "true" ]; then
            release_args+=(--draft)
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          if [ "$GENERATE_RELEASE_NOTES" = "true" ]; then
            release_args+=(--generate-notes)
          fi

          gh release create "${release_args[@]}"
